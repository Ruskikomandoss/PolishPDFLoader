[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polish-pdf-loader"
version = "0.1.0"
description = "LangChain-compatible PDF loaders with correct Polish character encoding"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langchain-core>=0.2",
    "click>=8.0",
]

[project.optional-dependencies]
pymupdf    = ["pymupdf>=1.23"]
pdfplumber = ["pdfplumber>=0.10"]
pypdf      = ["pypdf>=4.0"]
all        = ["pymupdf>=1.23", "pdfplumber>=0.10", "pypdf>=4.0", "chardet>=5.0"]
dev        = [
    "pytest>=8",
    "ruff>=0.4",
    "pymupdf>=1.23",
    "pdfplumber>=0.10",
    "pypdf>=4.0",
    "chardet>=5.0",
    "fpdf2>=2.7",
]

[project.scripts]
polish-pdf = "polish_pdf_loader.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires test fixture PDF"]
